skill: {name: dispatch-plan-risk-gate, risk_tier: high}
capabilities: {allow: [state.read, validation.read, review], require_approval: [plan.activate], deny: [plan.write, device.write, database.direct_write]}
authority: {precedence: [DOMAIN_RUNTIME, VALIDATOR, POLICY_GATE, TRUSTED_EVIDENCE, GENERATIVE_REASONING]}
evidence: {required_for: [domain_fact, identifier_fact], abstain_on_unsupported: true}
trajectory: {required_before: {plan.activate: [validation.pass, risk_gate.allow, human_approval.valid]}}
approval: {ttl_seconds: 900, bind_subject_version: true, bind_arguments: true}
execution: {mode: enforce}
